<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de Fútbol Virtual - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <header class="py-3 px-4 d-flex justify-content-between align-items-center">
    <h1 class="h2 text-warning m-0">Álbum de Fútbol Virtual</h1>
    <span class="badge bg-danger px-3 py-2 fs-6">Área restringida 🔒</span>
  </header>
  <main class="container my-auto py-5">
    <div class="row justify-content-center"><div class="col-10 col-sm-8 col-md-6 col-lg-5 col-xl-4">
      <div class="login-card p-4 p-sm-5">
        <div class="text-center mb-4"><h2 id="formTitle" class="h3 fw-bold text-warning mb-1">INICIAR SESIÓN</h2><p id="formDescription" class="small text-white-50">Accede para desbloquear y guardar tus cartas</p></div>
        <form id="authForm" novalidate>
          <div class="mb-3 auth-extra d-none" id="nombreGroup"><label for="nombre" class="form-label small fw-bold text-warning">Nombre completo</label><div class="input-group"><span class="input-group-text-custom d-flex align-items-center px-3">👤</span><input type="text" id="nombre" class="form-control form-control-custom" placeholder="Tu nombre" autocomplete="name"></div></div>
          <div class="mb-3"><label for="email" class="form-label small fw-bold text-warning">Correo electrónico</label><div class="input-group"><span class="input-group-text-custom d-flex align-items-center px-3">✉</span><input type="email" id="email" class="form-control form-control-custom" placeholder="usuario@utp.edu.mx" autocomplete="email" required></div></div>
          <div class="mb-3"><label for="password" class="form-label small fw-bold text-warning">Contraseña</label><div class="input-group"><span class="input-group-text-custom d-flex align-items-center px-3">🔑</span><input type="password" id="password" class="form-control form-control-custom" placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" required></div></div>
          <div id="errorAlert" class="alert alert-danger d-none py-2 px-3 small border-0 text-center" role="alert"></div>
          <div id="successAlert" class="alert alert-success d-none py-2 px-3 small border-0 text-center" role="status"></div>
          <button id="submitButton" type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 text-dark rounded-3">Ingresar al Álbum</button>
          <div class="text-center"><button type="button" class="btn btn-link text-decoration-none text-white-50 btn-sm" id="btnToggleAuth">¿No tienes cuenta? <span class="text-warning fw-bold">Registrarse</span></button></div>
        </form>
      </div>
    </div></div>
  </main>
  <footer class="text-center py-4 border-top border-secondary border-opacity-25 text-secondary">⚽ Álbum de Fútbol Virtual 2025/2026 | UTP - Seguridad integrada</footer>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
